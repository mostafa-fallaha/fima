name: fima-firefly

services:
  app:
    image: fireflyiii/core:version-6.7.9
    restart: unless-stopped
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Run scripts/setup_firefly.py first}
      APP_URL: http://localhost:8088
      SITE_OWNER: local@example.test
      TZ: Asia/Beirut
      DEFAULT_LANGUAGE: en_US
      DEFAULT_LOCALE: en_US
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup_firefly.py first}
      CACHE_STORE: file
      SESSION_DRIVER: file
      MAIL_MAILER: log
    volumes:
      - uploads:/var/www/html/storage/upload
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:lts
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: firefly
      MARIADB_USER: firefly
      MARIADB_PASSWORD: ${DB_PASSWORD:?Run scripts/setup_firefly.py first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Run scripts/setup_firefly.py first}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  uploads:
  database:
